name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One preview per pull request, and a superseded push is cancelled rather than
# left to race the newer one to the same tagged revision.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write # to comment the preview URL

env:
  SERVICE: agnte-preview

jobs:
  preview:
    # The repository is public. A pull request from a fork must never reach the
    # deployment credentials, and Dependabot does not need an environment.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # Creates pr-<n>, or reuses it on a subsequent push so the database this
      # pull request has been building against is not discarded. Both connection
      # URIs are masked before they are emitted.
      - name: Neon branch
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node infra/neon-branch.mjs create --pr "${{ github.event.number }}"

      - name: Run migrations
        env:
          DIRECT_URL: ${{ steps.neon.outputs.direct_url }}
        run: npx prisma migrate deploy

      - name: Build and push
        id: build
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/agnte/${SERVICE}:pr-${{ github.event.number }}-${GITHUB_SHA::7}"
          docker build --build-arg GIT_SHA="${GITHUB_SHA::7}" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Cloud Run rejects --no-traffic on a service's first revision, so the
      # very first preview deploy on a fresh service takes traffic and every
      # later one is tagged-only.
      - name: Does the preview service exist?
        id: existing
        run: |
          if gcloud run services describe "${SERVICE}" --region="${{ vars.GCP_REGION }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # A separate service from production, deliberately. max-instances is a
      # service-level cap, so previews sharing production's would let a preview
      # starve it (architecture.md §3.1).
      #
      # Previews are publicly reachable with no access gate — a deliberate
      # choice while they hold only synthetic data. Revisit before real data
      # reaches one.
      - name: Deploy
        id: deploy
        env:
          SHORT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ steps.neon.outputs.branch_name }}
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}
        run: |
          TAG="pr-${{ github.event.number }}"

          # A file rather than --set-env-vars, for two reasons. gcloud allows
          # only one of the env-var flags, and the preview database differs per
          # pull request so it cannot be mounted from Secret Manager alongside
          # static values. And a connection string may contain the comma that
          # --set-env-vars uses as its delimiter.
          #
          # Written by python with json.dumps: a JSON string is a valid YAML
          # scalar, so any character in the value survives without hand-rolled
          # quoting.
          # The tagged revision's own URL, so email links point at this preview
          # rather than at whatever Host a request happened to carry. Cloud Run
          # composes it as <tag>---<service host>, and the service's base URL is
          # read back rather than written down. Empty on the very first preview
          # deploy, where the app falls back to the request origin.
          SERVICE_URL=$(gcloud run services describe "${SERVICE}" \
            --region="${{ vars.GCP_REGION }}" \
            --format='value(status.url)' 2>/dev/null || true)
          if [[ -n "$SERVICE_URL" ]]; then
            APP_BASE_URL="${SERVICE_URL/https:\/\//https:\/\/${TAG}---}"
          else
            APP_BASE_URL=""
          fi

          TAG="${TAG}" APP_BASE_URL="${APP_BASE_URL}" \
          GCP_PROJECT_ID="${{ vars.GCP_PROJECT_ID }}" GCP_REGION="${{ vars.GCP_REGION }}" \
          python3 - > /tmp/preview-env.yaml <<'PY'
          import json, os
          values = {
              "APP_ENV": "preview",
              "GIT_SHA": os.environ["SHORT_SHA"][:7],
              "PREVIEW_LABEL": os.environ["TAG"],
              "NEON_BRANCH": os.environ["BRANCH_NAME"],
              "R2_PREFIX": os.environ["TAG"] + "/",
              "DATABASE_URL": os.environ["DATABASE_URL"],
              # Set unconditionally, which is inert on their own: getDeferredJobs()
              # needs the project, the region, a base URL *and* the shared secret
              # before it will build a queue, and the secret is mounted below only
              # if it exists. Two identifiers in the environment of a preview that
              # has no secret configure nothing.
              "GCP_PROJECT_ID": os.environ["GCP_PROJECT_ID"],
              "GCP_REGION": os.environ["GCP_REGION"],
          }
          # Omitted rather than sent empty: the config schema validates this as
          # a URL, and "" would fail the parse and take the whole app down.
          if os.environ.get("APP_BASE_URL"):
              values["APP_BASE_URL"] = os.environ["APP_BASE_URL"]
          for key, value in values.items():
              print(f"{key}: {json.dumps(value)}")
          PY

          SECRETS="R2_ENDPOINT=agnte-r2-endpoint:latest,R2_BUCKET=agnte-r2-bucket:latest,R2_ACCESS_KEY_ID=agnte-r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=agnte-r2-secret-access-key:latest"

          # Same conditional mount as production: previews deploy green before
          # Resend exists, and report email as not-configured on the status page.
          if gcloud secrets describe agnte-resend-api-key >/dev/null 2>&1 \
            && gcloud secrets describe agnte-email-from >/dev/null 2>&1; then
            SECRETS="${SECRETS},RESEND_API_KEY=agnte-resend-api-key:latest,EMAIL_FROM=agnte-email-from:latest"
          fi

          # Previews get their OWN signing key, never production's.
          #
          # They used to mount agnte-jwt-secret — the same secret production
          # signs with. Combined with previews being publicly reachable and
          # (until this change) branched from the production database, signing
          # in on a preview URL produced a token production would accept.
          #
          # Deliberately NOT falling back to the production secret when this one
          # is missing: a preview whose sign-in returns 503 is a nuisance the
          # status page explains, while a preview minting production-valid
          # tokens is the thing this exists to prevent.
          if gcloud secrets describe agnte-jwt-secret-preview >/dev/null 2>&1; then
            SECRETS="${SECRETS},JWT_SECRET=agnte-jwt-secret-preview:latest"
          else
            echo "::warning::agnte-jwt-secret-preview is not set — sign-in will" \
              "report as not-configured on this preview. Create it with" \
              "./infra/set-secrets.sh. Production's key is never used here."
          fi

          # And their own internal task callback secret, for the same reason
          # and with the same refusal to fall back: this one authenticates
          # callbacks to /internal/*, which Cloud Run cannot gate with IAM
          # because previews must open without a Google account. A preview
          # holding production's secret could drive production's internal
          # routes.
          #
          # The queue itself is shared with production. That is safe because a
          # task carries its own callback URL and its own bearer token, so a
          # preview's task reaches the preview and is rejected anywhere else.
          if gcloud secrets describe agnte-internal-tasks-secret-preview >/dev/null 2>&1; then
            SECRETS="${SECRETS},INTERNAL_TASKS_SECRET=agnte-internal-tasks-secret-preview:latest"
          else
            echo "::warning::agnte-internal-tasks-secret-preview is not set —" \
              "uploads will succeed on this preview but thumbnails will not" \
              "generate. Create it with ./infra/set-secrets.sh."
          fi

          FLAGS=(
            --image="${{ steps.build.outputs.image }}"
            --region="${{ vars.GCP_REGION }}"
            --service-account="${{ vars.GCP_RUNTIME_SA }}"
            --allow-unauthenticated
            --max-instances=2
            --min-instances=0
            --concurrency=80
            --timeout=60s
            --tag="${TAG}"
            --env-vars-file=/tmp/preview-env.yaml
            --set-secrets="${SECRETS}"
          )
          if [[ "${{ steps.existing.outputs.exists }}" == "true" ]]; then
            FLAGS+=(--no-traffic)
          fi

          gcloud run deploy "${SERVICE}" "${FLAGS[@]}"

          URL=$(gcloud run services describe "${SERVICE}" \
            --region="${{ vars.GCP_REGION }}" \
            --format="value(status.traffic.filter(tag=${TAG}).extract(url))" | tr -d "[]'")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for attempt in $(seq 1 10); do
            BODY=$(curl -fsS --max-time 20 "${URL}/v1/health" 2>/dev/null) && break
            echo "attempt ${attempt} failed; cold start can take a moment"
            sleep 6
          done
          echo "$BODY"
          echo "$BODY" | grep -q '"status":"ok"' \
            || { echo "::error::Health check did not report ok"; exit 1; }
          echo "$BODY" | grep -q '"name":"database","status":"ok"' \
            || { echo "::error::Database check is not ok"; exit 1; }
          echo "$BODY" | grep -q '"name":"object-storage","status":"ok"' \
            || { echo "::error::Object storage check is not ok"; exit 1; }

          # Health does not import the application modules, so it answered ok
          # for a revision whose every real route was throwing at import time
          # — a missing protobuf file in the standalone output took down
          # /v1/timeline, /v1/tags, /v1/verses, /v1/search and /v1/media while
          # this step reported success and promoted the revision to live.
          #
          # So probe a route that actually loads that graph. Unauthenticated,
          # it must answer 401: auth rejects the request before doing any work.
          # A 500 means the module never loaded at all, which is exactly the
          # failure that shipped.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${URL}/v1/timeline")
          echo "unauthenticated /v1/timeline -> ${STATUS}"
          [ "$STATUS" = "401" ] \
            || { echo "::error::/v1/timeline answered ${STATUS}, expected 401 — the app modules did not load"; exit 1; }

      # Edits one comment rather than adding another on every push, so the pull
      # request keeps a single live status instead of a growing list.
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- agnte-preview -->';
            const body = [
              marker,
              `### Preview for \`${context.sha.slice(0, 7)}\``,
              '',
              `**${{ steps.deploy.outputs.url }}**`,
              '',
              `Neon branch \`${{ steps.neon.outputs.branch_name }}\`, R2 prefix \`pr-${context.issue.number}/\`.`,
              'Torn down when this pull request closes.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
