name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two deploys at once, and never cancel one midway: an interrupted
# traffic migration can leave the service pointing at a half-checked revision.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  SERVICE: agnte

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Migrations run here, not at container boot. Booting instances would race
      # each other for the advisory lock and pay the cost on every cold start.
      # Running before the deploy also means a failed migration stops the
      # release rather than leaving a revision talking to the wrong schema.
      #
      # The direct URL is read from Secret Manager with the deployer's own
      # identity, so no connection string is stored in GitHub.
      - name: Run migrations
        run: |
          npm ci

          # Fetched as its own statement, deliberately. As an assignment prefix
          # (VAR="$(...)" cmd) a failed substitution does NOT stop the step under
          # set -e — only the final command's status counts — so prisma would run
          # with an empty URL and report "Connection url is empty", burying the
          # real error. That is exactly what happened the first time this ran.
          if ! DIRECT_URL="$(gcloud secrets versions access latest --secret=agnte-direct-url 2>&1)"; then
            echo "::error::Cannot read the agnte-direct-url secret."
            echo "$DIRECT_URL"
            echo "Check whether it exists and whether the deployer can read it:"
            echo "  gcloud secrets list --project=${{ vars.GCP_PROJECT_ID }}"
            echo "  gcloud secrets get-iam-policy agnte-direct-url --project=${{ vars.GCP_PROJECT_ID }}"
            echo "If it is missing, run: PROJECT_ID=${{ vars.GCP_PROJECT_ID }} ./infra/set-secrets.sh"
            exit 1
          fi
          if [[ -z "$DIRECT_URL" ]]; then
            echo "::error::agnte-direct-url is empty."
            exit 1
          fi
          export DIRECT_URL
          npx prisma migrate deploy

      - name: Build and push
        id: build
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/agnte/${SERVICE}:${GITHUB_SHA}"
          docker build --build-arg GIT_SHA="${GITHUB_SHA::7}" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Cloud Run rejects --no-traffic on a service's first revision: something
      # has to serve. So the first deploy goes straight to live (there is no
      # working version to protect yet) and every later one is gated.
      - name: Does the service already exist?
        id: existing
        run: |
          if gcloud run services describe "${SERVICE}" \
               --region="${{ vars.GCP_REGION }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # --max-instances=3 is the actual protection against a runaway bill
      # (architecture.md §3.1) — the budget kill switch only reacts to spend
      # data that lags by hours.
      - name: Deploy
        id: deploy
        run: |
          ENV_VARS="APP_ENV=production,GIT_SHA=${GITHUB_SHA::7}"
          SECRETS="DATABASE_URL=agnte-database-url:latest,R2_ENDPOINT=agnte-r2-endpoint:latest,R2_BUCKET=agnte-r2-bucket:latest,R2_ACCESS_KEY_ID=agnte-r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=agnte-r2-secret-access-key:latest"

          # Pin the origin used in email links rather than deriving it from the
          # request Host, which a client controls — a forged one would put an
          # attacker's domain into a verification link carrying the victim's
          # token. Read back from the service itself so there is no URL to keep
          # in sync here; on the very first deploy the service does not exist
          # yet, and the app falls back to the request origin for that one run.
          BASE_URL=$(gcloud run services describe "${SERVICE}" \
            --region="${{ vars.GCP_REGION }}" \
            --format='value(status.url)' 2>/dev/null || true)
          if [[ -n "$BASE_URL" ]]; then
            ENV_VARS="${ENV_VARS},APP_BASE_URL=${BASE_URL}"
          fi

          # Mounted only once they exist, so deploying the code that needs them
          # is not blocked on the secrets being created. Without them the app
          # has no email transport: the status page says so, and registration
          # answers 503 rather than accepting a registration it cannot confirm.
          if gcloud secrets describe agnte-resend-api-key >/dev/null 2>&1 \
            && gcloud secrets describe agnte-email-from >/dev/null 2>&1; then
            SECRETS="${SECRETS},RESEND_API_KEY=agnte-resend-api-key:latest,EMAIL_FROM=agnte-email-from:latest"
          else
            echo "::warning::Resend is not configured; registration will answer 503. Run ./infra/set-secrets.sh"
          fi

          # Same conditional mount, same reason: this deploys green before the
          # key exists, and the status page reports signing as not-configured
          # rather than sign-in failing mysteriously.
          if gcloud secrets describe agnte-jwt-secret >/dev/null 2>&1; then
            SECRETS="${SECRETS},JWT_SECRET=agnte-jwt-secret:latest"
          else
            echo "::warning::No JWT signing key; sign-in will answer 503. Run ./infra/set-secrets.sh"
          fi

          FLAGS=(
            --image="${{ steps.build.outputs.image }}"
            --region="${{ vars.GCP_REGION }}"
            --service-account="${{ vars.GCP_RUNTIME_SA }}"
            --allow-unauthenticated
            --max-instances=3
            --min-instances=0
            --concurrency=80
            --timeout=60s
            --set-env-vars="${ENV_VARS}"
            --set-secrets="${SECRETS}"
          )
          if [[ "${{ steps.existing.outputs.exists }}" == "true" ]]; then
            FLAGS+=(--no-traffic --tag=candidate)
          fi
          gcloud run deploy "${SERVICE}" "${FLAGS[@]}"

          if [[ "${{ steps.existing.outputs.exists }}" == "true" ]]; then
            URL=$(gcloud run services describe "${SERVICE}" \
              --region="${{ vars.GCP_REGION }}" \
              --format='value(status.traffic.filter(tag=candidate).extract(url))' | tr -d "[]'")
          else
            URL=$(gcloud run services describe "${SERVICE}" \
              --region="${{ vars.GCP_REGION }}" --format='value(status.url)')
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Checking $URL"

      - name: Smoke test
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for attempt in $(seq 1 10); do
            BODY=$(curl -fsS --max-time 20 "${URL}/v1/health" 2>/dev/null) && break
            echo "attempt ${attempt} failed; cold start can take a moment"
            sleep 6
          done
          echo "$BODY"
          echo "$BODY" | grep -q '"status":"ok"' \
            || { echo "::error::Health check did not report ok"; exit 1; }
          echo "$BODY" | grep -q "\"commit\":\"${GITHUB_SHA::7}\"" \
            || { echo "::error::Serving revision is not this commit"; exit 1; }
          echo "$BODY" | grep -q '"name":"database","status":"ok"' \
            || { echo "::error::Database check is not ok on the new revision"; exit 1; }
          echo "$BODY" | grep -q '"name":"object-storage","status":"ok"' \
            || { echo "::error::Object storage check is not ok on the new revision"; exit 1; }

      # Only reached if the smoke test passed, so a broken revision never
      # serves a single production request — better than deploying and rolling
      # back, which serves errors in between.
      - name: Promote to live
        if: steps.existing.outputs.exists == 'true'
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --region="${{ vars.GCP_REGION }}" --to-latest

      - name: Summary
        run: |
          URL=$(gcloud run services describe "${SERVICE}" \
            --region="${{ vars.GCP_REGION }}" --format='value(status.url)')
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
